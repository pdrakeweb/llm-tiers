# Verified 2026-11-11.
[versions]
llmTiers = "0.1.0-SNAPSHOT"
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.13"
hilt = "2.60.1"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
okhttp = "5.5.1"
junit4 = "4.13.2"

[libraries]
llmtiers-core = { module = "io.github.pdrakeweb:llm-tiers-core", version.ref = "llmTiers" }
llmtiers-openai = { module = "io.github.pdrakeweb:llm-tiers-openai", version.ref = "llmTiers" }
llmtiers-android = { module = "io.github.pdrakeweb:llm-tiers-android", version.ref = "llmTiers" }
llmtiers-litert = { module = "io.github.pdrakeweb:llm-tiers-litert", version.ref = "llmTiers" }
llmtiers-modelmanager = { module = "io.github.pdrakeweb:llm-tiers-model-manager", version.ref = "llmTiers" }
llmtiers-testing = { module = "io.github.pdrakeweb:llm-tiers-testing", version.ref = "llmTiers" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
junit4 = { module = "junit:junit", version.ref = "junit4" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
